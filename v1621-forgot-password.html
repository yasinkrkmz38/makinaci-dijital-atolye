<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071015"><title>Şifremi Unuttum • Dijital Makinacı</title><link rel="stylesheet" href="/v1621-style.css?v=16.2.1"></head><body class="authStandalone"><main class="standaloneCard"><a class="standaloneBrand" href="/">⚙ <b>DİJİTAL MAKİNACI</b></a><span class="badge">HESAP KURTARMA</span><h1>Şifreni yenile</h1><p>Kayıtlı e-posta adresini yaz. E-posta servisi etkinse 30 dakika geçerli tek kullanımlık bağlantı göndereceğiz.</p><div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="email" placeholder="ornek@mail.com"></div><button id="send" class="primary wide">Yenileme bağlantısı gönder →</button><div id="message" class="standaloneMessage"></div><a class="backLogin" href="/">← Giriş ekranına dön</a></main><script>const $=i=>document.getElementById(i);$('send').onclick=async()=>{let b=$('send');b.disabled=true;$('message').textContent='İstek gönderiliyor…';try{let r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'İşlem başarısız');$('message').className='standaloneMessage success';$('message').textContent=d.message}catch(e){$('message').className='standaloneMessage error';$('message').textContent=e.message}finally{b.disabled=false}};</script></body></html>
