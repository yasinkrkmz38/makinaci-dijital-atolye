<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teknik Kütüphane</title><link rel="stylesheet" href="/app.css"></head><body><header><a class="brand" href="/">⚙️ <b>Makinacı</b><small>DİJİTAL ATÖLYE V7</small></a><nav><a href="/pages/tools.html">Atölye Araçları</a><a href="/pages/workshop.html">Benim Atölyem</a><a href="/pages/diagnose.html">Arıza Teşhis</a><a href="/pages/library.html">Teknik Kütüphane</a></nav></header><main style="max-width:1200px;margin:auto;padding:60px 5%"><div class="eyebrow">ENGINEERING KNOWLEDGE BASE</div><h1>Teknik Kütüphane</h1><p style="color:#8fa1a8">Talaşlı imalat, bakım, ölçüm ve CNC için teknik bilgi bankası.</p><input id="q" placeholder="Teknik konu ara..." style="width:100%;padding:15px;background:#061014;color:#fff;border:1px solid #294047;border-radius:9px"><div id="list" class="cards" style="padding:25px 0"></div></main><script>const a=[['Talaşlı İmalat','Torna operasyonları','Kesme hızı, devir, ilerleme ve takım yaklaşımı.'],['Talaşlı İmalat','Frezeleme temelleri','Vc, rpm, fz ve tabla ilerlemesi ilişkisi.'],['Bakım','Planlı bakım','Periyodik bakım planı ve kayıt disiplini.'],['Bakım','Rulman kontrolü','Ses, sıcaklık, titreşim ve yağlama kontrolleri.'],['Ölçüm','Tolerans ve geçmeler','Nominal ölçü, tolerans ve geçme mantığı.'],['Ölçüm','Ölçüm disiplini','Kumpas, mikrometre ve komparatör prensipleri.'],['CNC','CNC proses hazırlığı','Bağlama, takım, sıfır ve operasyon sırası.'],['CNC','Kesme parametreleri','Vc, rpm, fz ve ilerleme ilişkileri.']];function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('list').innerHTML=a.filter(x=>(x[1]+' '+x[2]).toLowerCase().includes(q)).map(x=>`<div class="card"><small>${x[0]}</small><h3>${x[1]}</h3><p>${x[2]}</p><button onclick="alert('Teknik kart: ${x[1]}\n\nUygulamada üretici dokümanı ve ilgili standartlar doğrulanmalıdır.')">Kartı Aç →</button></div>`).join('')||'<p>Sonuç bulunamadı.</p>'}q.oninput=render;render()</script></body></html>
