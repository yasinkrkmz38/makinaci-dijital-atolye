<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071015"><title>Yeni Şifre • Dijital Makinacı</title><link rel="stylesheet" href="/v1621-style.css?v=16.2.1"></head><body class="authStandalone"><main class="standaloneCard"><a class="standaloneBrand" href="/">⚙ <b>DİJİTAL MAKİNACI</b></a><span class="badge">GÜVENLİ ŞİFRE YENİLEME</span><h1>Yeni şifreni oluştur</h1><p id="intro">Bağlantı doğrulanıyor…</p><div id="form" class="hide"><div class="field"><label>Yeni şifre</label><input id="password" type="password" autocomplete="new-password" placeholder="En az 8 karakter"></div><div class="field"><label>Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Tekrar yaz"></div><button id="save" class="primary wide">Şifreyi kaydet →</button></div><div id="message" class="standaloneMessage"></div><a class="backLogin" href="/">← Giriş ekranına dön</a></main><script>const $=i=>document.getElementById(i),token=new URLSearchParams(location.search).get('token')||'';async function init(){try{let r=await fetch('/api/auth/reset-password/validate?token='+encodeURIComponent(token)),d=await r.json();if(!d.valid)throw Error('Bu şifre yenileme bağlantısının süresi dolmuş veya geçersiz.');$('intro').textContent='Hesabın için güçlü ve yeni bir şifre belirle.';$('form').classList.remove('hide')}catch(e){$('intro').textContent=e.message;$('message').className='standaloneMessage error'}}$('save').onclick=async()=>{let p=$('password').value,c=$('confirm').value;if(p.length<8){$('message').textContent='Şifre en az 8 karakter olmalı';return}if(p!==c){$('message').textContent='Şifreler eşleşmiyor';return}try{let r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error||'İşlem başarısız');$('form').classList.add('hide');$('intro').textContent='Şifren başarıyla yenilendi.';$('message').className='standaloneMessage success';$('message').innerHTML='Artık yeni şifrenle giriş yapabilirsin. <a href="/">Giriş yap →</a>'}catch(e){$('message').className='standaloneMessage error';$('message').textContent=e.message}};init();</script></body></html>
