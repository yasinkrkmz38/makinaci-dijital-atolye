<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071015">
  <title>Dijital Makinacı</title>
  <style>
    html,body{height:100%;margin:0;background:#071015;color:#eef5f3;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .box{width:min(420px,100%);text-align:center}
    .gear{font-size:48px;margin-bottom:12px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#81949b;font-size:13px}
  </style>
</head>
<body>
  <div class="box">
    <div class="gear">⚙</div>
    <h1>Dijital Makinacı açılıyor…</h1>
    <p>Güncel çalışma alanına yönlendiriliyorsunuz.</p>
  </div>
  <script>
    // server.js içindeki eski wildcard fallback bu dosyaya düşerse
    // kullanıcı eski V16 arayüzünü görmek yerine güncel ana uygulamaya döner.
    if (location.pathname !== '/' || location.search) {
      location.replace('/');
    } else {
      location.reload();
    }
  </script>
</body>
</html>
