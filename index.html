<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071015">
  <title>Dijital Makinacı</title>
  <style>
    html,body{height:100%;margin:0;background:#071015;color:#edf6f3;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .card{max-width:430px;text-align:center}
    .gear{font-size:46px;margin-bottom:12px}
    h1{font-size:21px;margin:0 0 8px}
    p{color:#8fa3aa;font-size:14px;line-height:1.55}
    a{color:#65ef9b}
  </style>
  <meta http-equiv="refresh" content="0;url=/">
</head>
<body>
  <div class="card">
    <div class="gear">⚙</div>
    <h1>Güncel çalışma alanı açılıyor…</h1>
    <p>Otomatik yönlendirme olmazsa <a href="/">Dijital Makinacı'yı aç</a>.</p>
  </div>
  <script>
    // server.js wildcard fallback'i bu dosyayı döndürür.
    // / rotası ise doğrudan güncel v1621-index.html'i servis eder.
    if (location.pathname !== '/') location.replace('/');
  </script>
</body>
</html>
