<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arıza Teşhis Merkezi</title><link rel="stylesheet" href="/app.css"></head><body><header><a class="brand" href="/">⚙️ <b>Makinacı</b><small>DİJİTAL ATÖLYE V7</small></a><nav><a href="/pages/tools.html">Atölye Araçları</a><a href="/pages/workshop.html">Benim Atölyem</a><a href="/pages/diagnose.html">Arıza Teşhis</a><a href="/pages/library.html">Teknik Kütüphane</a></nav></header><main style="max-width:1200px;margin:auto;padding:60px 5%"><div class="eyebrow">FAULT DIAGNOSTICS</div><h1>Arıza Teşhis Merkezi</h1><p style="color:#8fa1a8">Belirtiyi seç → güvenli kontrol sırasını takip et → olası nedenleri daralt.</p><div id="choices"></div><div id="out"></div></main><script>const data={motor:['⚡ Motor çalışmıyor',['Enerjiyi izole et.','Besleme ve sigortayı kontrol et.','Termik/kontaktör durumunu kontrol et.','Motor bağlantılarını kontrol et.','Mekanik sıkışmayı kontrol et.'],'Besleme · termik · kontaktör · bağlantı · mekanik kilitlenme'],titreşim:['〰️ Aşırı titreşim',['Makina bağlantılarını kontrol et.','Kaplin hizasını kontrol et.','Rulman boşluğunu kontrol et.','Balans ve eksantrikliği değerlendir.'],'Hizalama · balans · rulman · gevşeklik'],ses:['🔊 Anormal ses',['Ses kaynağını belirle.','Yağlama durumunu kontrol et.','Rulman ve dişlileri kontrol et.','Sürtme/gevşek parça ara.'],'Yağlama · rulman · dişli · sürtme'],sicaklik:['🌡️ Aşırı ısınma',['Yükü kontrol et.','Soğutmayı kontrol et.','Yağlama durumunu kontrol et.','Rulman ve sürtünmeyi kontrol et.','Motor akımını kontrol et.'],'Aşırı yük · soğutma · yağlama · rulman'],hidrolik:['💧 Hidrolik kaçak',['Basıncı güvenli şekilde boşalt.','Hortum/rakorları kontrol et.','Yağ seviyesi ve filtreyi kontrol et.','Pompa/valf çevresini kontrol et.'],'Conta · rakor · hortum · pompa'],basinc:['🌀 Basınç düşmesi',['Göstergeyi doğrula.','Kaçak kontrolü yap.','Filtreyi kontrol et.','Pompa/kompresörü kontrol et.','Regülatör ve valfi doğrula.'],'Kaçak · filtre · pompa · regülatör']};const c=document.getElementById('choices');c.innerHTML=Object.keys(data).map(k=>`<button onclick="show('${k}')" style="margin:6px;padding:14px">${data[k][0]}</button>`).join('');function show(k){let d=data[k];document.getElementById('out').innerHTML=`<div style="margin-top:25px;padding:25px;border:1px solid #294047;border-radius:14px;background:#09151a"><h2>${d[0]}</h2><div style="border:1px solid #65423d;padding:12px;border-radius:9px">⚠️ Enerji izolasyonu ve üretici prosedürü uygulanmadan tehlikeli bölgeye müdahale etmeyin.</div>${d[1].map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('')}<p style="color:#63df8a"><b>Olası kaynaklar:</b> ${d[2]}</p></div>`}</script></body></html>
